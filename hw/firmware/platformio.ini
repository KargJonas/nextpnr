; HITL firmware environments.
;
; Flash HITL firmware (FPGA programming host):
;   pio run -e pico -t upload
;   pio run -e pico -t uploadfs
;
; Flash LA sanity-check (square wave on GPIO26):
;   pio run -e squarewave -t upload
;
; Flash pure MCU LED blinky (no FPGA, no serial wait):
;   pio run -e blinky -t upload

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

[env:pico]
extends = common
board_build.filesystem_size = 0.5m
build_src_filter = -<*> +<main.cpp>
lib_deps =
    vicharak-in/Shrike@^1.0.0

[env:squarewave]
extends = common
build_src_filter = -<*> +<squarewave.cpp>

[env:blinky]
extends = common
build_src_filter = -<*> +<blinky.cpp>
